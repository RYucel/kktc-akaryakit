name: Akaryakıt fiyatlarını güncelle

on:
  schedule:
    # UTC; gece yürürlüğe giren kararları da yakalamak için günde beş kontrol.
    - cron: '17 0,6,12,18,21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Güncelleme yöntemi
        type: choice
        options: [otomatik, manuel]
        default: otomatik
      tarih:
        description: 'Manuel: yürürlük tarihi (YYYY-MM-DD)'
        type: string
      b95:
        description: 'Manuel: 95 oktan TL/litre (ör. 71,12)'
        type: string
      b98:
        description: 'Manuel: 98 oktan TL/litre'
        type: string
      dz:
        description: 'Manuel: Euro Diesel TL/litre'
        type: string
      kaynak_url:
        description: 'Manuel: fiyatların kaynak bağlantısı (https://...)'
        type: string
      yayin_tarihi:
        description: 'Manuel: kaynağın yayın tarihi (YYYY-MM-DD)'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fuel-price-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: npm ci
      - run: python -m pip install -r scripts/requirements.txt
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Resmî Gazete'den al
        if: inputs.mode != 'manuel'
        run: npm run prices:update
      - name: Manuel girdiyi doğrula ve uygula
        if: inputs.mode == 'manuel'
        env:
          PRICE_DATE: ${{ inputs.tarih }}
          PRICE_B95: ${{ inputs.b95 }}
          PRICE_B98: ${{ inputs.b98 }}
          PRICE_DZ: ${{ inputs.dz }}
          SOURCE_URL: ${{ inputs.kaynak_url }}
          PUBLICATION_DATE: ${{ inputs.yayin_tarihi }}
        run: |
          mkdir -p .tmp
          node scripts/manual-input.mjs
          npm run prices:manual -- .tmp/manual-prices.json
      - run: npm run build
      - name: Doğrulanan veriyi kaydet
        id: commit
        run: |
          if git diff --quiet -- public/data/piyasa.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/data/piyasa.json
            git commit -m 'Resmî akaryakıt fiyatlarını ve kaynak kontrolünü güncelle'
            # Concurrent manual edits fail safely; never force-push.
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Başarısız güncellemeyi bildir
        if: failure()
        run: echo 'Fiyat güncellemesi tamamlanamadı. Son başarılı yayın korunuyor. Kaynağı inceleyip yeniden çalıştırın veya manuel fiyat girin.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    # GITHUB_TOKEN pushes do not trigger push workflows: call deployment explicitly.
    uses: ./.github/workflows/deploy.yml
